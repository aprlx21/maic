[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "maic-offline"
version = "0.1.0"
description = "PDF to reviewed lesson plans, slides and teaching scripts"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "python-dotenv>=1,<2", "sqlalchemy>=2.0,<3",
  "psycopg[binary,pool]>=3.2,<4", "minio>=7.2,<8", "openai>=1.68,<3",
  "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4", "langgraph-checkpoint-postgres>=3,<4",
  "PyMuPDF>=1.25,<2", "python-pptx>=1.0,<2", "python-docx>=1.1,<2",
  "Pillow>=11,<13", "matplotlib>=3.10,<4", "numpy>=2.2,<3", "tiktoken>=0.9,<1",
  "filelock>=3.17,<4", "httpx>=0.28,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
